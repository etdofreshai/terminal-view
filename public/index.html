<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal View</title>
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="login-screen" aria-label="Terminal password screen">
      <form id="login-form" autocomplete="off">
        <div class="login-card">
          <p class="login-kicker">Secure shell</p>
          <h1>Terminal View</h1>
          <label for="terminal-password">Password</label>
          <input id="terminal-password" name="password" type="password" autofocus autocomplete="current-password" />
          <button type="submit">Unlock terminal</button>
          <p id="login-error" role="alert"></p>
        </div>
      </form>
    </section>
    <section id="terminal-screen" hidden>
      <header>
        <div>
          <h1>Terminal View</h1>
          <p id="status">Locked</p>
        </div>
        <div class="header-actions">
          <button id="reconnect" type="button">Reconnect</button>
          <button id="logout" type="button">Log out</button>
        </div>
      </header>
      <main id="terminal"></main>
    </section>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
    <script src="app.js"></script>
  </body>
</html>
